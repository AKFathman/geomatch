name: Dram CI

on:
  push:
    branches: [main]
    paths: ["dram/**", ".github/workflows/dram-ci.yml"]
  pull_request:
    paths: ["dram/**", ".github/workflows/dram-ci.yml"]
  workflow_dispatch:

concurrency:
  group: dram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile — typecheck, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dram/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dram/apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run lint

  database:
    name: Database — migrations, seed, smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Apply migrations + seed and run smoke tests
        run: dram/supabase/scripts/local-check.sh
      - name: Types are up to date
        run: |
          python3 dram/supabase/scripts/gen-types.py dram_check /tmp/database.types.ts
          diff -u dram/apps/mobile/src/lib/database.types.ts /tmp/database.types.ts

  functions:
    name: Edge functions — deno check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check identify-label
        working-directory: dram/supabase/functions/identify-label
        run: deno check index.ts
      - name: Check send-push
        working-directory: dram/supabase/functions/send-push
        run: deno check index.ts
